name: TodayEarnings
options:
  bundleIdPrefix: com.callum
  deploymentTarget:
    iOS: '17.0'
packages:
  EarningsCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  TodayEarnings:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: EarningsCore
      - target: EarningsWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.callum.TodayEarnings
        CODE_SIGN_ENTITLEMENTS: Configuration/App.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: 今日进账
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Configuration/App-Info.plist
      properties:
        CFBundleDisplayName: 今日进账
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.callum.TodayEarnings
            CFBundleURLSchemes: [todayearnings]
  EarningsWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: App/SharedStore.swift
    dependencies:
      - package: EarningsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.callum.TodayEarnings.widget
        CODE_SIGN_ENTITLEMENTS: Configuration/App.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Configuration/Widget-Info.plist
      properties:
        CFBundleDisplayName: 今日进账
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  TodayEarnings:
    build:
      targets:
        TodayEarnings: all
    run:
      config: Debug
